name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies & build web
        run: |
          npm install
          npm run build

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Set minSdk 26 (Android 8.0+)
        run: sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon-only.png
          cp public/icon-512.png assets/icon-foreground.png
          cp public/icon-512.png assets/icon-background.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#dbeafe' || echo "icon generation skipped"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info
          cp app/build/outputs/apk/debug/app-debug.apk ../HappyEnglish.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HappyEnglish-APK
          path: HappyEnglish.apk

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: انگلیسی شاد - نسخه ${{ github.run_number }}
          files: HappyEnglish.apk
